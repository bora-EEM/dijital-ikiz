# Cloudflare Workers ayarı. Gizli değerler buraya YAZILMAZ; `npx wrangler secret put <AD>` ile girilir:
#   GEMINI_API_KEY, GROQ_API_KEY, GITHUB_TOKEN (yalnız bilgi deposunda Contents: read + Issues: write),
#   GEMINI_UCRETLI_API_KEY (paralı yuva; yoksa o yuva kapalı),
#   TURNSTILE_SECRET, IMZA_SIRRI, SINAV_ANAHTARI (araclar/guvenlik_sirlari.py kurar, değer yazdırmaz),
#   ILETISIM_EPOSTA (ikizin verdiği adres; yoksa ikiz cevap vermez), DAVET_ANAHTARI (özgeçmiş bağlantısının kodu)
name = "dijital-ikiz"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Hata günlükleri panelde görünsün (Workers → dijital-ikiz → Logs): kayıt ya da bilgi dosyası sessizce düşmesin.
[observability]
enabled = true

# Aynı adresten dakikada en çok 8 soru; bütün sunucu örnekleri için ortak sayaç.
[[ratelimits]]
name = "HIZ_SINIRI"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

# Üçüncü yapay zekâ yuvası: Cloudflare Workers AI, ücretsiz günlük pay, anahtar gerekmez.
[ai]
binding = "AI"

# Kalıcı sayaç (src/sayac.js): günlük soru sınırları, paralı model harcaması, issue spam engeli, bilgi yedeği.
# Ücretsiz planda SQLite tabanlı Durable Object.
[[durable_objects.bindings]]
name = "SAYAC"
class_name = "Sayac"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sayac"]

[vars]
BILGI_DEPO = "bora-EEM/dijital-ikiz-bilgi"
IZINLI_KOKENLER = "https://bora-eem.github.io"
# ILETISIM_EPOSTA burada değil, sunucunun gizli ayarında (açık depoda görünmesin; Bora'nın kararı 2026-10-19).
GEMINI_MODELLER = "gemini-3.5-flash-lite"
# Groq kapalı: istem dakikalık 8.000 token sınırını aşıyor (2026-10-19). Geri açmak için model adını yaz.
GROQ_MODELLER = ""
# Bot doğrulaması ve imza sırları yoksa sunucu açık kalmaz, cevap vermez (yanlış yapılandırma sessizce açık kapı olmasın).
TURNSTILE_ZORUNLU = "1"
# Günlük sınırlar (src/sayac.js varsayılanlarıyla aynı; buradan değiştirilir).
GUNLUK_SORU = "400"
IP_GUNLUK = "60"
OTURUM_SORU = "20"
GUNLUK_KAYIT = "30"
DAVET_GUNLUK = "300"
GUNLUK_BUTCE_USD = "2"
# Paralı yedek iki basamak (Bora'nın kararı 2026-10-19): önce aynı Flash-Lite paralı anahtarla (ücretsiz kota dolunca),
# o da düşerse farklı model 3.8 Flash (Flash-Lite çöktüğü saatte o çalışıyordu). Aynı modelin paralı yuvası yalnız
# ücretsiz yuva kota (429) yüzünden düştüyse denenir (src/ikiz.js). Her model ayrı sınavdan geçmeden listeye girmez.
# 2026-10-20: şimdilik yalnız Flash-Lite (ücretsiz yuvayla aynı model, 90 soruluk sınavı geçti). 3.8 Flash yeni istem ve
# bilgiyle sınanmadı; Bora onaylarsa sınavdan sonra listeye geri girer.
GEMINI_UCRETLI_MODELLER = "gemini-3.5-flash-lite"
